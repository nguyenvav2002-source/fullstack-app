services:
  mysql:
    image: mysql:8.4
    container_name: fullstack-mysql
    environment:
      MYSQL_DATABASE: fullstack_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp_user", "-papp_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: fullstack-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: fullstack_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      FRONTEND_ORIGIN: http://localhost:4200
    ports:
      - "8080:8080"
